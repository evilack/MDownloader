name: Build extension packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate all distributions
        run: npm run build:all

      - name: Upload distribution ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: MDownloader-distributions
          path: |
            artifacts/distributions/*/MDownloader-*.zip
            artifacts/distributions/*/build.json
          if-no-files-found: error
          compression-level: 0
