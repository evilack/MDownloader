name: Build extension packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Check tag against extension version
        if: github.ref_type == 'tag'
        run: |
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match extension version v$version."
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate all distributions
        run: npm run build:all

      - name: Upload distribution ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: MDownloader-distributions
          path: |
            artifacts/distributions/*/MDownloader-*.zip
            artifacts/distributions/*/build.json
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v7
        with:
          name: MDownloader-distributions
          path: distributions

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          packages=()
          for flavor in chrome-store edge-store development; do
            package="distributions/$flavor/MDownloader-$flavor-$version.zip"
            if [[ ! -s "$package" ]]; then
              echo "Missing distribution: $package" >&2
              exit 1
            fi
            packages+=("$package")
          done
          gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
