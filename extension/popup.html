<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="html_popup_title">MDownloader</title>
<link rel="stylesheet" href="style.css">
<body class="popup">
<header class="brand brand-with-options"><strong>MDownloader</strong></header>
<main>
  <p class="notice" role="status" data-youtube-policy-notice data-i18n="youtube_store_policy_notice" hidden></p>
  <section id="popup-media">
  <p id="status" class="notice" role="status" data-candidate-status data-i18n="html_scanning_page"></p>
  <ul id="candidates" data-i18n-aria-label="html_detected_media"></ul>
  </section>
</main>
<footer class="actions">
  <button id="scan" type="button" data-i18n-aria-label="html_rescan" data-i18n-title="html_rescan">
    <img class="button-icon" src="icons/refresh.png" alt="" width="20" height="20">
  </button>
  <button id="manage" type="button" class="icon-button" data-i18n-aria-label="html_download_manager" data-i18n-title="html_download_manager">
    <img class="button-icon" src="icons/app-media-24.png" alt="" width="20" height="20">
  </button>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
