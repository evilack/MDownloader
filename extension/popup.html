<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="html_popup_title">M Downloader</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="media-row.css">
<link rel="stylesheet" href="download-options.css">
<link rel="stylesheet" href="local-captions.css">
<body class="popup">
<header class="brand brand-with-options"><strong>M Downloader</strong><div class="window-actions">
  <button id="scan" type="button" class="icon-button" data-i18n-aria-label="html_rescan" data-i18n-title="html_rescan"><img class="button-icon" src="icons/refresh.png" alt="" width="20" height="20"></button>
  <button id="manage" type="button" class="icon-button" data-i18n-aria-label="html_download_manager" data-i18n-title="html_download_manager"><img class="button-icon" src="icons/app-media-24.png" alt="" width="20" height="20"></button>
</div></header>
<main>
  <div class="site-access-intro" data-site-access-intro hidden>
    <p class="notice" data-i18n="view_site_access_intro"></p>
    <a class="site-access-link" href="options.html?section=permissions" target="_blank" rel="noopener" data-i18n="view_site_access_settings"></a>
    <button type="button" data-site-access-dismiss data-i18n="view_site_access_dismiss"></button>
  </div>
  <p class="notice" role="status" data-youtube-policy-notice data-i18n="youtube_store_policy_notice" hidden></p>
  <section id="popup-media">
  <p id="status" class="notice" role="status" data-candidate-status data-i18n="html_scanning_page"></p>
  <a class="site-access-link" href="options.html?section=permissions" target="_blank" rel="noopener" data-candidate-permission-link data-i18n="view_site_access_settings" hidden></a>
  <ul id="candidates" data-i18n-aria-label="html_detected_media"></ul>
  </section>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
