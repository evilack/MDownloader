<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="view_action_show">MDownloader</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="saved-folder.css">
<body class="options">
<header class="brand"><strong>MDownloader</strong></header>
<main>
  <h1 data-i18n="view_action_show"></h1>
  <p id="folder-name"></p>
  <p><strong id="saved-name"></strong></p>
  <p><a id="open-saved-file" target="_blank" rel="noopener" data-i18n="view_open_saved_file" hidden></a></p>
  <button id="folder-access" type="button" data-i18n="opt_restore_folder_access" hidden></button>
  <p id="folder-status" role="status"></p>
  <ul id="saved-files"></ul>
</main>
<script type="module" src="saved-folder.js"></script>
</body>
</html>
